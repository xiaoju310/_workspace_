<text x="305" y="551" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">小狐狸从一封陌生的来信开始，走进森林寻找答案。</text>
<text x="305" y="574" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">它通过询问小鸟、拜访邮局结识小熊，也学会主动表达自己的心意。</text>
<text x="305" y="597" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">勇气有时就是迈出一步，友谊从愿意回应开始。</text>
