<rect x="62" y="797" width="1477" height="220" rx="14" fill="#eaf0e3" stroke="none"/>
<text x="88" y="835" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="20" font-weight="600" fill="#244d3f">统一状态与版本约束</text>
<text x="88" y="871" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">每个业务页面：加载 / 空数据 / 正常成功 / 明确失败；错误可重试，不静默伪造成功。</text>
<text x="88" y="894" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">修改笔记或原书文字、页序 → 原审核与旧分享失效；图书重新校对、分类与复核后才可进入伴读。</text>
<text x="88" y="917" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">分享到期、被撤销或模拟用户不匹配 → 隐藏内容；真实身份、令牌和权限由后端完成。</text>
<text x="88" y="940" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">本地图片只在内存预览，刷新后重新导入；元信息、笔记、分享和历史保存在当前标签的 sessionStorage。</text>
<text x="88" y="963" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="13" font-weight="400" fill="#244d3f">A/C 接入点：HTTP 适配器、上传 / 校对 / 任务回调、视频 URL、音频问答、点击识别、笔记与分享服务。</text>
<text x="62" y="1061" font-family="Microsoft YaHei,PingFang SC,sans-serif" font-size="12" font-weight="400" fill="#8b9980">设计交付：SVG 文字与路径可编辑；导入 Figma 后需建立原生 Auto Layout 和 Prototype 连接。</text></svg>