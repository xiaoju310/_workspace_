[project]
name = "paper-companion-ai"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "Pillow>=10", "opencv-python>=4.10,<6"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
ocr = ["paddlepaddle>=3.3,<4", "paddleocr>=3.7,<4"]
vlm = ["torch>=2.6,<3", "transformers>=4.49,<5", "accelerate>=1,<2"]
video = ["torch>=2.6,<3", "diffusers>=0.31,<0.38", "transformers>=4.49,<5", "accelerate>=1,<2", "safetensors>=0.4"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
markers = ["integration: runs a local model or media tool"]
