<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="#fbf7e9"/><rect x="28" y="28" width="544" height="744" fill="none" stroke="#e6dfc9"/><image href="data:image/svg+xml;base64," x="135" y="55" width="330" height="440"/><g fill="#315a48" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="300" y="550" font-size="29" font-weight="600">月亮邮局</text><text x="300" y="605" font-size="19">夜晚，邮局的灯亮了。</text><text x="300" y="641" font-size="19">小兔写下一封信，</text><text x="300" y="677" font-size="19">想把今天的心愿寄给月亮。</text><text x="300" y="740" font-size="12" fill="#8c937c">01 · 原创演示页</text></g></svg>