<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800" viewBox="0 0 600 800"><rect width="600" height="800" fill="#fbf7e9"/><rect x="28" y="28" width="544" height="744" fill="none" stroke="#e6dfc9"/><image href="data:image/svg+xml;base64," x="135" y="55" width="330" height="440"/><g fill="#315a48" text-anchor="middle" font-family="Microsoft YaHei,sans-serif"><text x="300" y="550" font-size="29" font-weight="600">一颗种子的旅行</text><text x="300" y="605" font-size="19">季节更替，花朵结出新的种子。</text><text x="300" y="641" font-size="19">风把种子带向远方，</text><text x="300" y="677" font-size="19">新的生长又开始了。</text><text x="300" y="740" font-size="12" fill="#8c937c">03 · 原创演示页</text></g></svg>